name: Deploy Next.js to Self-Hosted Runner

on:
  push:
    branches:
      - main # 僅在 push 到 main 分支時觸發

jobs:
  build-and-deploy:
    # 關鍵：指定此 job 必須在 self-hosted runner 上運行
    runs-on: self-hosted

    steps:
      - name: 'Checkout Code'
        # 步驟 1: 將觸發此 workflow 的特定 commit 程式碼下載到 runner
        uses: actions/checkout@v4

      - name: 'Create .env file'
        # 步驟 2: 從單一 GitHub Secret 建立 .env 檔案
        # 改用 powershell，因為您的 runner 是 Windows 環境
        shell: powershell
        run: |
          Write-Output "Creating .env file from single GitHub Secret..."
          
          # 取得 Secret 內容
          $envContent = @"
          ${{ secrets.PROJECT_ENV_FILE }}
          "@
          
          # 定義檔案路徑
          $filePath = ".env"
          
          # 關鍵：使用 .NET System.IO.File 寫入 UTF-8 (No BOM) 格式
          # 如果直接用 PowerShell 的 > 或 Out-File，預設會有 BOM 或變成 UTF-16，導致 Docker 讀取失敗
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($filePath, $envContent, $utf8NoBom)
          
          # 檢查檔案是否建立成功
          if (Test-Path $filePath) {
            Write-Output ".env file created successfully."
            Get-Item $filePath
          } else {
            Write-Error "Error: .env file not created."
            exit 1
          }

      - name: 'Build and Restart Docker Compose Service'
        # 步驟 3: 執行 docker compose 命令
        run: |
          echo "Running docker compose command to rebuild and deploy..."
          
          # 此命令在 runner 容器內執行,但透過掛載的 socket
          # 它實際上是在控制 "主機" 的 Docker 服務。
          docker compose -f docker-compose.yml up -d --build moxu-nextjs
          
          echo "Deployment completed."

      - name: 'Prune old Docker images'
        # (可選) 步驟 4: 清理舊的、未被使用的 Docker 映像檔
        if: always()
        run: |
          docker image prune -f