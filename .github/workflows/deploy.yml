name: Deploy Next.js to Self-Hosted Runner

on:
  push:
    branches:
      - main # 僅在 push 到 main 分支時觸發

jobs:
  build-and-deploy:
    # 關鍵：指定此 job 必須在 self-hosted runner 上運行
    runs-on: self-hosted

    steps:
      - name: 'Checkout Code'
        # 步驟 1: 將最新的程式碼 checkout 到 runner 的工作區
        uses: actions/checkout@v4

      - name: 'Create .env file'
        # 步驟 2: 建立 .env 檔案
        # 強制使用 bash 以正確處理換行符號與編碼
        shell: bash
        run: |
          echo "Creating .env file from single GitHub Secret..."
          
          # 直接將整個 Secret (PROJECT_ENV_FILE) 的內容寫入 .env
          # 雙引號是必須的，這樣才能保留 Secret 內部的換行符號
          echo "${{ secrets.PROJECT_ENV_FILE }}" > .env
          
          # 檢查檔案是否建立成功
          if [ -f .env ]; then
            echo ".env file created successfully."
          else
            echo "Error: .env file not created."
            exit 1
          fi

      - name: 'Build and Restart Docker Compose Service'
        # 步驟 3: 執行 docker compose 命令
        run: |
          echo "Running docker compose command to rebuild and deploy..."
          
          # 此命令在 runner 容器內執行,但透過掛載的 socket
          # 它實際上是在控制 "主機" 的 Docker 服務。
          docker compose -f docker-compose.yml up -d --build moxu-nextjs
          
          echo "Deployment completed."

      - name: 'Prune old Docker images'
        # (可選) 步驟 4: 清理舊的、未被使用的 Docker 映像檔
        if: always()
        run: |
          docker image prune -f