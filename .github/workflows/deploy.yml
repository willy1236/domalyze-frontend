name: Deploy Next.js to Self-Hosted Runner

on:
  push:
    branches:
      - main # 僅在 push 到 main 分支時觸發

jobs:
  # CI：程式碼檢查 / Build 測試
  ci-checks:
    name: Run Type Check & Build (CI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type Check
        run: npm run type-check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

  build-and-deploy:
    # 關鍵：指定此 job 必須在 self-hosted runner 上運行
    runs-on: self-hosted
    needs: ci-checks

    steps:
      - name: 'Checkout Code'
        # 步驟 1: 將觸發此 workflow 的特定 commit 程式碼下載到 runner
        uses: actions/checkout@v4

      - name: Remove old .env
        # self-hosted runner 使用「持久化」資料夾，checkout 並不會刪除 Git 未追蹤的檔案。
        shell: powershell
        run: |
          if (Test-Path ".env") {
            Remove-Item ".env" -Force
            Write-Output "Old .env removed."
          }


      - name: 'Create .env file'
        # 步驟 3: 從單一 GitHub Secret 建立 .env 檔案
        # 改用 powershell，因為您的 runner 是 Windows 環境
        shell: powershell
        # [修正 1] 將 Secret 映射到環境變數，這是最穩定且安全的方式
        # 避免了直接在腳本中注入文字可能導致的語法錯誤或縮排問題
        env:
          SECRET_ENV_FILE: ${{ secrets.PROJECT_ENV_FILE }}
        run: |
          Write-Output "Creating .env file from single GitHub Secret..."
          
          # 從環境變數讀取內容
          $content = $env:SECRET_ENV_FILE
          $filePath = ".env"
          
          # [修正 2] 檢查內容是否為空
          if ([string]::IsNullOrWhiteSpace($content)) {
            Write-Error "Error: The secret 'PROJECT_ENV_FILE' is empty or not found. Please check GitHub Settings."
            exit 1
          }
          
          # 印出長度以供除錯 (不印出內容以保密)
          Write-Output "Secret content length: $($content.Length) characters."
          
          # 使用 .NET System.IO.File 寫入 UTF-8 (No BOM) 格式
          $utf8NoBom = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($filePath, $content, $utf8NoBom)
          
          # 最終檢查
          if ((Get-Item $filePath).Length -gt 0) {
            Write-Output "Success: .env file created with content."
          } else {
            Write-Error "Error: .env file was created but is empty (0 bytes)."
            exit 1
          }

      - name: 'Build and Restart Docker Compose Service'
        # 步驟 4: 執行 docker compose 命令
        run: |
          echo "Running docker compose command to rebuild and deploy..."
          
          # 此命令在 runner 容器內執行,但透過掛載的 socket
          # 它實際上是在控制 "主機" 的 Docker 服務。
          docker compose -f docker-compose.yml up -d --build nextjs
          
          echo "Deployment completed."

      - name: 'Prune old Docker images'
        # (可選) 步驟 5: 清理舊的、未被使用的 Docker 映像檔
        if: always()
        run: |
          docker image prune -f